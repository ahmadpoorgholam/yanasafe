<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanaSafe - Offline</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 600px;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #6EE7B7; margin-bottom: 16px; }
        p { line-height: 1.6; color: #666; }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #6EE7B7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 24px;
            transition: background 0.3s;
        }
        .button:hover { background: #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're Offline</h1>
        <p>
            It seems you've lost your internet connection. Don't worry - your safety
            is still our priority. Some features of YanaSafe are available offline.
        </p>
        <a href="/" class="button">Try Again</a>
    </div>
</body>
</html>
