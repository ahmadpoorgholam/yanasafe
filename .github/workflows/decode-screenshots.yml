name: Decode screenshot catalog

on:
  push:
    branches: [main]
    paths:
      - "docs/screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble part files and decode base64 screenshots
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd docs/screenshots

          # Assemble any *.png.b64.partNN into *.png.b64
          for part0 in *.png.b64.part00; do
            base="${part0%.part00}"
            echo "Assembling $base from parts"
            cat "$base".part* > "$base"
          done

          decoded=0
          for f in *.png.b64; do
            out="${f%.b64}"
            echo "Decoding $f -> $out"
            base64 -d "$f" > "$out"
            decoded=$((decoded+1))
          done
          echo "Decoded $decoded PNG(s)"
          ls -la

      - name: Commit decoded PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png || true
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "docs: decode screenshot catalog PNGs"
            git push
          fi
