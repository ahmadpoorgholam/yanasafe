name: Decode screenshot catalog

on:
  push:
    paths:
      - 'docs/screenshots/*.b64'
      - '.github/workflows/decode-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 screenshots to PNG
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in docs/screenshots/*.png.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
      - name: Commit PNGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: decode screenshot catalog PNGs"
          file_pattern: docs/screenshots/*.png
