name: Assemble package-lock
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/assemble-lock.yml"
      - "package.json"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate package-lock.json
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "package-lock.json already present"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          test -f package-lock.json
          python3 -c "import json,os; d=json.load(open('package-lock.json')); print('packages', len(d.get('packages',{})), 'size', os.path.getsize('package-lock.json'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync YanaSafe source batch 6"
          git push
